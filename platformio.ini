[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
check_tool = cppcheck
check_skip_packages = yes

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
test_build_src = yes
build_src_filter = +<alarm_logic.cpp> +<display_mode.cpp> +<state_logic.cpp>